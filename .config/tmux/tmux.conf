# Prefix: Ctrl+Space (fallback for anything not covered by Alt bindings)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Index from 1 (more keyboard-friendly)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse, vi-mode, nvim-friendly escape time
set -g mouse on
setw -g mode-keys vi

# Clipboard: copy goes to the Wayland clipboard (needs wl-clipboard)
# Alt+V enters copy mode; v starts selection, C-v toggles block, y copies.
# Mouse drag also copies on release.
set -s set-clipboard on
set -s copy-command 'wl-copy'
bind -n M-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000

# Allow notifications and progress updates to reach the outer terminal
set -g allow-passthrough on

# Extended keys — allows Shift+Enter to be distinguished from Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ── Gruvbox theme ─────────────────────────────────────────────────────────────
set -g status-position bottom

set -g status-style              "bg=#3c3836,fg=#ebdbb2"
set -g pane-border-style         "fg=#3c3836"
set -g pane-active-border-style  "fg=#d79921"
set -g message-style             "bg=#d79921,fg=#282828,bold"
set -g message-command-style     "bg=#282828,fg=#d79921"
set -g mode-style                "bg=#d79921,fg=#282828"

set -g status-interval     5
set -g status-justify      left
set -g status-left-length  30
set -g status-right-length 80

set -g status-left  " #[fg=#fabd2f,bold]#S#{?client_prefix,#[fg=#fe8019] ·,} #[fg=#504945,nobold]│ "
set -g status-right "#[fg=#8ec07c]#(cd #{pane_current_path}; git symbolic-ref --short HEAD 2>/dev/null) "

setw -g window-status-style          "fg=#7c6f64"
setw -g window-status-current-style  "fg=#fabd2f,bold"
setw -g window-status-format         " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-separator      "  "
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# Clean order file when a session is killed
set-hook -g session-closed 'run-shell "~/.local/bin/tmux-sessions cleanup #{hook_session_name}"'

# ── Kill server ───────────────────────────────────────────────────────────────
bind -n M-X confirm-before -p "Kill tmux server? (y/n)" kill-server

# ── Predefined sessions ────────────────────────────────────────────────────────
bind -n M-Enter switch-client -t main
bind -n M-m switch-client -t monitor

# ── Sessionizer: fuzzy find folder → open/switch session ──────────────────────
bind -n M-f display-popup -E -h 70% -w 70% -b rounded "~/.local/bin/tmux-sessionizer"

# ── Harpoon: manage user sessions ─────────────────────────────────────────────
bind -n M-Tab display-popup -E -h 16 -w 36 -b rounded "~/.local/bin/tmux-harpoon"

# ── Windows: Alt+N new (asks for a name), Alt+Shift+1-9 jump, Alt+Shift+Tab reorder ──
bind -n M-n command-prompt -p "Window name:" {
    if -F "%%" { new-window -c "#{pane_current_path}" -n "%%" } { new-window -c "#{pane_current_path}" }
}
bind -n M-BTab display-popup -E -h 16 -w 36 -b rounded "~/.local/bin/tmux-harpoon windows"
bind -n 'M-!' select-window -t :=1
bind -n 'M-@' select-window -t :=2
bind -n 'M-#' select-window -t :=3
bind -n 'M-$' select-window -t :=4
bind -n 'M-%' select-window -t :=5
bind -n 'M-^' select-window -t :=6
bind -n 'M-&' select-window -t :=7
bind -n 'M-*' select-window -t :=8
bind -n 'M-(' select-window -t :=9

# ── Project sessions by index (Alt+1-9; pinned sessions are excluded) ────────
bind -n M-1 run-shell "~/.local/bin/tmux-sessions switch 1"
bind -n M-2 run-shell "~/.local/bin/tmux-sessions switch 2"
bind -n M-3 run-shell "~/.local/bin/tmux-sessions switch 3"
bind -n M-4 run-shell "~/.local/bin/tmux-sessions switch 4"
bind -n M-5 run-shell "~/.local/bin/tmux-sessions switch 5"
bind -n M-6 run-shell "~/.local/bin/tmux-sessions switch 6"
bind -n M-7 run-shell "~/.local/bin/tmux-sessions switch 7"
bind -n M-8 run-shell "~/.local/bin/tmux-sessions switch 8"
bind -n M-9 run-shell "~/.local/bin/tmux-sessions switch 9"
